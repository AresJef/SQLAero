[package]
name = "sqlaero-core"
description = "Native protocol, binding and result core for SQLAero"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mysql_common.workspace = true
flate2.workspace = true
mio.workspace = true
socket2.workspace = true
rustls.workspace = true
aws-lc-rs.workspace = true
rustls-platform-verifier.workspace = true
rustls-pki-types.workspace = true
pkcs8.workspace = true
zeroize.workspace = true
encoding_rs.workspace = true
num-bigint.workspace = true
thiserror.workspace = true
itoa.workspace = true
zmij.workspace = true
memchr.workspace = true

[dev-dependencies]
regex = "=1.13.1"

[target.'cfg(target_vendor = "apple")'.dependencies]
security-framework.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(any(target_vendor = "apple", windows)))'.dependencies]
rustls-native-certs = "=0.8.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[lints]
workspace = true
