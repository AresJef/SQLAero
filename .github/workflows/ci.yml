name: Native build checks

on:
  push:
    branches: [main, codex/rust-sync-kernel]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Native probe target; use all for the supported native preflight.
        type: choice
        default: all
        options: [all, macos-arm64, macos-x86_64, windows-x86_64, windows-arm64, linux-x86_64, linux-glibc-aarch64, linux-musl-x86_64, linux-musl-aarch64]

permissions:
  contents: read

jobs:
  native-smoke:
    if: ${{ !startsWith(inputs.platform, 'linux-musl-') }}
    name: Native probe / ${{ matrix.platform }} / CPython 3.13
    runs-on: ${{ fromJSON('{"macos-arm64":"macos-26","macos-x86_64":"macos-15-intel","windows-x86_64":"windows-2022","windows-arm64":"windows-11-arm","linux-x86_64":"ubuntu-24.04","linux-glibc-aarch64":"ubuntu-24.04-arm"}')[matrix.platform] }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["macos-arm64","macos-x86_64","windows-x86_64","windows-arm64","linux-x86_64","linux-glibc-aarch64"]') }}
    defaults:
      run:
        shell: bash
    env:
      SQLAERO_NATIVE_MYSQL: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.17"
          architecture: ${{ (matrix.platform == 'macos-arm64' || matrix.platform == 'windows-arm64' || matrix.platform == 'linux-glibc-aarch64') && 'arm64' || 'x64' }}
      - name: Prepare the shared native test environment
        uses: ./.github/actions/native-environment
      - name: Verify native sources
        run: |
          set -euo pipefail
          rustc --version
          python --version
          cargo fmt --all --check
          cargo test -p sqlaero-core --locked
          cargo clippy --workspace --locked -- -D warnings
          python tools/error_catalog.py --check
          pyright
      - name: Build the native probe wheel
        if: runner.os != 'Linux'
        run: |
          maturin build --release --locked --interpreter python --out probe-wheels
      - name: Build the manylinux probe wheel
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: '1.15.0'
          rust-toolchain: '1.99.1'
          target: ${{ matrix.platform == 'linux-glibc-aarch64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu' }}
          manylinux: '2_28'
          args: --release --locked --interpreter python3.13 --out probe-wheels
      - name: Install the actual probe wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          wheels: list[Path] = list(Path('probe-wheels').glob('*.whl'))
          assert len(wheels) == 1, wheels
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheels[0])], check=True)
          PY
      - name: Verify the installed wheel and real MySQL behavior
        run: |
          set -euo pipefail
          mkdir -p probe-evidence
          python - <<'PY'
          import hashlib
          from importlib.metadata import version
          import json
          from pathlib import Path
          import platform
          import sqlaero
          from sqlaero import _sqlaero
          import sys
          import sysconfig
          import zipfile
          wheel: Path = next(Path('probe-wheels').glob('*.whl'))
          native: Path = Path(_sqlaero.__file__).resolve()
          assert native.is_relative_to(Path(sys.prefix).resolve()), native
          with zipfile.ZipFile(wheel) as archive:
              members: list[str] = [name for name in archive.namelist() if name.endswith(('.so', '.pyd'))]
              assert len(members) == 1, members
              assert hashlib.sha256(archive.read(members[0])).hexdigest() == hashlib.sha256(native.read_bytes()).hexdigest()
          Path('probe-evidence/installed-identity.json').write_text(json.dumps({'wheel': wheel.name, 'version': version('sqlaero'), 'package': sqlaero.__file__, 'native': str(native), 'native_sha256': hashlib.sha256(native.read_bytes()).hexdigest(), 'python_platform': sysconfig.get_platform(), 'machine': platform.machine(), 'python': sys.version}, indent=2) + '\n')
          PY
          python tools/mysql_fixture.py prepare > probe-evidence/mysql-instances.json
          cargo test -p sqlaero-core --lib explicit_roots_keep_platform_ssl_name_usage_and_time_policy --locked -- --ignored --test-threads=1
          cargo test -p sqlaero-core --test establish --locked -- --ignored --test-threads=1
          cargo test -p sqlaero-core --test component_contracts --locked -- --ignored --test-threads=1
          cargo test -p sqlaero-core --test protocol_wire --locked -- --ignored --test-threads=1
          python tests/_native_signal.py
          python tests/_native_signal.py --pytest -q tests --junitxml=probe-evidence/python-tests.xml
          python -m pip check
      - name: Stop only this job's isolated servers
        if: always()
        run: python tools/mysql_fixture.py stop
      - name: Collect redacted native server diagnostics
        if: always()
        run: python tools/mysql_fixture.py diagnostics --output probe-evidence
      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-probe-${{ matrix.platform }}-cp313
          path: probe-evidence/
          if-no-files-found: warn
          retention-days: 7

  musl-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || startsWith(inputs.platform, 'linux-musl-')) }}
    name: Musl probe / ${{ matrix.architecture }} / CPython 3.13
    runs-on: ${{ matrix.architecture == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.platform == 'linux-musl-aarch64' && '["aarch64"]' || inputs.platform == 'linux-musl-x86_64' && '["x86_64"]' || '["x86_64","aarch64"]') }}
    defaults:
      run:
        shell: bash
    env:
      SQLAERO_NATIVE_MYSQL: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.17'
          architecture: ${{ matrix.architecture == 'aarch64' && 'arm64' || 'x64' }}
      - name: Prepare the shared native server environment
        uses: ./.github/actions/native-environment
      - name: Prepare the owned loopback servers outside musl
        run: |
          set -euo pipefail
          mkdir -p probe-evidence
          python tools/mysql_fixture.py prepare > probe-evidence/mysql-instances.json
      - name: Prepare pinned official clients at the shared administration boundary
        run: |
          set -euo pipefail
          # Only this ephemeral job's Docker daemon is shared with its musl
          # test container. SQLAero itself never calls Docker or this bridge.
          docker pull mysql:8.4.13
          docker pull mysql:9.7.4
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import shlex
          import subprocess
          root = Path(os.environ['SQLAERO_TEST_MYSQL_ROOT'])
          identities = {}
          for label, version in [('84', '8.4.13'), ('97', '9.7.4')]:
              image = subprocess.check_output(
                  ['docker', 'image', 'inspect', f'mysql:{version}', '--format', '{{index .RepoDigests 0}}'],
                  text=True).strip()
              command = ['docker', 'run', '--rm', '-i', '--network', 'host',
                         '--user', f'{os.getuid()}:{os.getgid()}',
                         '-v', f'{root}:{root}:ro', '--entrypoint', 'mysql', image]
              wrapper = root / f'mysql-client-{label}'
              wrapper.write_text('#!/bin/sh\nexec ' + shlex.join(command) + ' "$@"\n')
              wrapper.chmod(0o700)
              identities[label] = image
          Path('probe-evidence/mysql-client-images.json').write_text(json.dumps(identities, indent=2))
          PY
          python tools/mysql_fixture.py clients \
            --client84 "$SQLAERO_TEST_MYSQL_ROOT/mysql-client-84" \
            --client97 "$SQLAERO_TEST_MYSQL_ROOT/mysql-client-97"
      - name: Build and exercise the actual musl Python and wheel
        env:
          TARGET: ${{ matrix.architecture }}-unknown-linux-musl
          IMAGE: quay.io/pypa/musllinux_1_2_${{ matrix.architecture }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' > probe-evidence/container-image.json
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -v "$SQLAERO_TEST_MYSQL_ROOT:$SQLAERO_TEST_MYSQL_ROOT" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e SQLAERO_TEST_MYSQL_ROOT -e SQLAERO_NATIVE_MYSQL -e TARGET \
            -e SQLAERO_TEST_TLS="$SQLAERO_TEST_MYSQL_ROOT/tls" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/work \
            "$IMAGE" bash -euo pipefail -c '
              apk add --no-cache ca-certificates curl tzdata nodejs patchelf docker-cli openssl
              export CARGO_HOME=/tmp/sqlaero-cargo RUSTUP_HOME=/tmp/sqlaero-rustup
              export PATH="$CARGO_HOME/bin:/opt/python/cp313-cp313/bin:$PATH"
              curl --proto "=https" --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs -o /tmp/sqlaero-rustup.sh
              sh /tmp/sqlaero-rustup.sh -y --profile minimal --default-toolchain 1.99.1 --component clippy,rustfmt --no-modify-path
              python -m venv /tmp/sqlaero-musl-env
              export PATH="/tmp/sqlaero-musl-env/bin:$PATH"
              export PYO3_PYTHON="/tmp/sqlaero-musl-env/bin/python"
              export CARGO_TARGET_DIR=/tmp/sqlaero-musl-target
              python -m pip install --disable-pip-version-check -r requirements-dev.txt
              rustc -vV > probe-evidence/toolchain.txt
              python -c "import _testcapi, sys; print(sys.version)"
              cargo fmt --all --check
              cargo test -p sqlaero-core --locked
              cargo clippy --workspace --all-targets --locked -- -D warnings
              python tools/error_catalog.py --check
              pyright --pythonpath "$PYO3_PYTHON"
              maturin build --release --locked --target "$TARGET" --compatibility musllinux_1_2 --interpreter python --out probe-wheels
              python -m pip install --no-deps probe-wheels/*.whl
              python tools/release_artifacts.py identity --kind original --wheel probe-wheels/*.whl --output probe-evidence/installed-identity.json
              cargo test -p sqlaero-core --lib explicit_roots_keep_platform_ssl_name_usage_and_time_policy --locked -- --ignored --test-threads=1
              cargo test -p sqlaero-core --test establish --locked -- --ignored --test-threads=1
              cargo test -p sqlaero-core --test component_contracts --locked -- --ignored --test-threads=1
              cargo test -p sqlaero-core --test protocol_wire --locked -- --ignored --test-threads=1
              python tests/_native_signal.py
              python tests/_native_signal.py --pytest -q tests --junitxml=probe-evidence/python-tests.xml
              python -m pip check
            '
      - name: Stop only this jobs isolated servers
        if: always()
        run: python tools/mysql_fixture.py stop
      - name: Collect redacted native server diagnostics
        if: always()
        run: python tools/mysql_fixture.py diagnostics --output probe-evidence
      - name: Preserve the actual musl probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-probe-linux-musl-${{ matrix.architecture }}-cp313
          path: probe-evidence/
          if-no-files-found: warn
          retention-days: 7
