name: Native build checks

on:
  push:
    branches: [main, codex/rust-sync-kernel, codex/rust-sync-cross-platform-beta]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-smoke:
    name: Native probe / ${{ matrix.platform.name }} / CPython 3.13
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform:
          - {name: macos-arm64, runner: macos-26, architecture: arm64}
          - {name: macos-x86_64, runner: macos-15-intel, architecture: x64}
          - {name: windows-x86_64, runner: windows-2022, architecture: x64}
          - {name: linux-x86_64, runner: ubuntu-24.04, architecture: x64}
    defaults:
      run:
        shell: bash
    env:
      SQLAERO_NATIVE_MYSQL: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.17"
          architecture: ${{ matrix.platform.architecture }}
      - name: Install the fixed native toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
      - name: Prepare the isolated Python environment
        run: |
          set -euo pipefail
          python -m venv .venv
          if [ "$RUNNER_OS" = Windows ]; then
            vpython=.venv/Scripts/python
          else
            vpython=.venv/bin/python
          fi
          "$vpython" -m pip install --disable-pip-version-check -r requirements-dev.txt
          "$vpython" - <<'PY'
          import os
          from pathlib import Path
          import sys
          with Path(os.environ['GITHUB_PATH']).open('a', encoding='utf-8') as output:
              output.write(str(Path(sys.executable).parent) + '\n')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              output.write('SQLAERO_TEST_MYSQL_ROOT=' + str(Path(os.environ['RUNNER_TEMP']) / 'sqlaero-mysql') + '\n')
          PY
          mkdir -p probe-evidence
      - name: Provision native MySQL executables
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            brew install --force-bottle --skip-post-install mysql@8.4 mysql@9.7 openssl@4
            echo "SQLAERO_MYSQL_84_ROOT=$(brew --prefix mysql@8.4)" >> "$GITHUB_ENV"
            echo "SQLAERO_MYSQL_97_ROOT=$(brew --prefix mysql@9.7)" >> "$GITHUB_ENV"
            echo "SQLAERO_OPENSSL=$(brew --prefix openssl@4)/bin/openssl" >> "$GITHUB_ENV"
          else
            if [ "$RUNNER_OS" = Linux ]; then
              sudo apt-get update -qq
              sudo apt-get install -y libaio1t64 libnuma1 libtinfo6
            fi
            for pair in 84:8.4.13 97:9.7.4; do
              label="${pair%%:*}"
              version="${pair#*:}"
              line="${version%.*}"
              destination="$RUNNER_TEMP/mysql-$label"
              mkdir -p "$destination"
              if [ "$RUNNER_OS" = Windows ]; then
                archive="mysql-$version-winx64.zip"
              else
                archive="mysql-$version-linux-glibc2.28-x86_64-minimal.tar.xz"
              fi
              curl --fail --location --proto '=https' --proto-redir '=https' --retry 2 --max-time 240 \
                "https://dev.mysql.com/get/Downloads/MySQL-$line/$archive" -o "$RUNNER_TEMP/$archive"
              if [ "$RUNNER_OS" = Windows ]; then
                python -m zipfile -e "$RUNNER_TEMP/$archive" "$destination"
              else
                tar -xf "$RUNNER_TEMP/$archive" -C "$destination"
              fi
              if [ "$RUNNER_OS" = Linux ]; then
                ldd "$destination"/*/bin/mysqld
              fi
              MYSQL_LABEL="$label" MYSQL_DIRECTORY="$destination" MYSQL_ARCHIVE="$RUNNER_TEMP/$archive" python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          directory: Path = Path(os.environ['MYSQL_DIRECTORY'])
          installations: list[Path] = [path for path in directory.iterdir() if path.is_dir() and (path / 'bin').is_dir()]
          assert len(installations) == 1, installations
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as output:
              output.write(f"SQLAERO_MYSQL_{os.environ['MYSQL_LABEL']}_ROOT={installations[0]}\n")
          archive: Path = Path(os.environ['MYSQL_ARCHIVE'])
          with archive.open('rb') as input_file:
              print(archive.name, hashlib.file_digest(input_file, 'sha256').hexdigest())
          PY
            done
          fi
      - name: Verify native sources and build a probe wheel
        run: |
          set -euo pipefail
          rustc --version
          python --version
          cargo fmt --all --check
          cargo test -p sqlaero-core --locked
          cargo clippy --workspace --locked -- -D warnings
          python tools/error_catalog.py --check
          pyright
          maturin build --release --locked --interpreter python --out probe-wheels
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          wheels: list[Path] = list(Path('probe-wheels').glob('*.whl'))
          assert len(wheels) == 1, wheels
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheels[0])], check=True)
          PY
      - name: Verify the installed wheel and real MySQL behavior
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from importlib.metadata import version
          import json
          from pathlib import Path
          import sqlaero
          from sqlaero import _sqlaero
          import sys
          import zipfile
          wheel: Path = next(Path('probe-wheels').glob('*.whl'))
          native: Path = Path(_sqlaero.__file__).resolve()
          assert native.is_relative_to(Path(sys.prefix).resolve()), native
          with zipfile.ZipFile(wheel) as archive:
              members: list[str] = [name for name in archive.namelist() if name.endswith(('.so', '.pyd'))]
              assert len(members) == 1, members
              assert hashlib.sha256(archive.read(members[0])).hexdigest() == hashlib.sha256(native.read_bytes()).hexdigest()
          Path('probe-evidence/installed-identity.json').write_text(json.dumps({'wheel': wheel.name, 'version': version('sqlaero'), 'package': sqlaero.__file__, 'native': str(native), 'native_sha256': hashlib.sha256(native.read_bytes()).hexdigest()}, indent=2) + '\n')
          PY
          python tools/mysql_fixture.py prepare > probe-evidence/mysql-instances.json
          python -m pytest -q tests --junitxml=probe-evidence/python-tests.xml
          python -m pip check
      - name: Stop only this job's isolated servers
        if: always()
        run: python tools/mysql_fixture.py stop
      - name: Collect native server diagnostics without credentials
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import shutil
          source: Path = Path(os.environ['SQLAERO_TEST_MYSQL_ROOT'])
          destination: Path = Path('probe-evidence')
          destination.mkdir(exist_ok=True)
          for label in ('84', '97'):
              for name in ('initialize.log', 'server.log', 'launcher.log'):
                  log: Path = source / label / name
                  if log.is_file():
                      shutil.copyfile(log, destination / f'mysql-{label}-{name}')
          PY
      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-probe-${{ matrix.platform.name }}-cp313
          path: probe-evidence/
          if-no-files-found: warn
          retention-days: 7
