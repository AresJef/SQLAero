name: Native build checks

on:
  push:
    branches: [main, codex/rust-sync-kernel]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Native probe target; use all for the supported native preflight.
        type: choice
        default: all
        options: [all, macos-arm64, macos-x86_64, windows-x86_64, windows-arm64, linux-glibc-x86_64, linux-glibc-aarch64, linux-musl-x86_64, linux-musl-aarch64]
      python:
        description: Ordinary-GIL CPython minor for the selected native check.
        type: choice
        default: '3.13'
        options: ['3.12', '3.13', '3.14', '3.15']
      published:
        description: Verify the current project version from PyPI instead of building its wheel.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native-smoke:
    if: ${{ !startsWith(inputs.platform, 'linux-') }}
    name: Native probe / ${{ matrix.platform }} / CPython ${{ inputs.python || '3.13' }}
    runs-on: ${{ fromJSON('{"macos-arm64":"macos-26","macos-x86_64":"macos-15-intel","windows-x86_64":"windows-2022","windows-arm64":"windows-11-arm"}')[matrix.platform] }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["macos-arm64","macos-x86_64","windows-x86_64","windows-arm64"]') }}
    defaults:
      run:
        shell: bash
    env:
      SQLAERO_NATIVE_MYSQL: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ fromJSON('{"3.12":"3.12.10","3.13":"3.13.17","3.14":"3.14.9","3.15":"3.15.1"}')[inputs.python || '3.13'] }}
          architecture: ${{ (matrix.platform == 'macos-arm64' || matrix.platform == 'windows-arm64') && 'arm64' || 'x64' }}
      - name: Prepare the shared native test environment
        uses: ./.github/actions/native-environment
      - name: Verify native sources
        run: |
          set -euo pipefail
          rustc --version
          python --version
          cargo fmt --all --check
          cargo test -p sqlaero-core --locked
          cargo clippy --workspace --locked -- -D warnings
          python tools/error_catalog.py --check
          pyright
      - name: Build the native probe wheel
        if: ${{ !inputs.published }}
        run: |
          maturin build --release --locked --interpreter python --out probe-wheels
      - name: Download the exact published project version
        if: inputs.published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json
          python tools/release_artifacts.py download --version "$version" --manifest release-manifest.json --destination probe-wheels --output probe-evidence/pypi-download.json
      - name: Install the actual probe wheel
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          wheels: list[Path] = list(Path('probe-wheels').glob('*.whl'))
          assert len(wheels) == 1, wheels
          subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheels[0])], check=True)
          PY
      - name: Verify the installed wheel and real MySQL behavior
        run: |
          set -euo pipefail
          mkdir -p probe-evidence
          python tools/release_artifacts.py identity --kind "${{ inputs.published && 'pypi' || 'original' }}" --wheel probe-wheels/*.whl --output probe-evidence/installed-identity.json
          python tools/mysql_fixture.py prepare > probe-evidence/mysql-instances.json
          cargo test -p sqlaero-core --lib explicit_roots_keep_platform_ssl_name_usage_and_time_policy --locked -- --ignored --test-threads=1
          cargo test -p sqlaero-core --test establish --locked -- --ignored --test-threads=1
          cargo test -p sqlaero-core --test component_contracts --locked -- --ignored --test-threads=1
          cargo test -p sqlaero-core --test protocol_wire --locked -- --ignored --test-threads=1
          python tests/_native_signal.py
          python tests/_native_signal.py --pytest -q tests --junitxml=probe-evidence/python-tests.xml
          python -m pip check
      - name: Stop only this job's isolated servers
        if: always()
        run: python tools/mysql_fixture.py stop
      - name: Collect redacted native server diagnostics
        if: always()
        run: python tools/mysql_fixture.py diagnostics --output probe-evidence
      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-probe-${{ matrix.platform }}-cp${{ inputs.python || '3.13' }}
          path: probe-evidence/
          if-no-files-found: warn
          retention-days: 7

  linux-smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || startsWith(inputs.platform, 'linux-') }}
    name: Linux probe / ${{ matrix.platform }} / CPython ${{ inputs.python || '3.13' }}
    runs-on: ${{ endsWith(matrix.platform, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || github.event_name == 'workflow_dispatch' && '["linux-glibc-x86_64","linux-glibc-aarch64","linux-musl-x86_64","linux-musl-aarch64"]' || '["linux-glibc-x86_64"]') }}
    defaults:
      run:
        shell: bash
    env:
      SQLAERO_NATIVE_MYSQL: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ fromJSON('{"3.12":"3.12.10","3.13":"3.13.17","3.14":"3.14.9","3.15":"3.15.1"}')[inputs.python || '3.13'] }}
          architecture: ${{ endsWith(matrix.platform, 'aarch64') && 'arm64' || 'x64' }}
      - name: Prepare the shared native server environment
        uses: ./.github/actions/native-environment
      - name: Read the published project manifest
        if: inputs.published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          gh release download "v$version" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.json
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Prepare the owned loopback servers outside the target libc
        run: |
          set -euo pipefail
          mkdir -p probe-evidence
          python tools/mysql_fixture.py prepare > probe-evidence/mysql-instances.json
      - name: Build, install and run the complete suite in the real target libc
        env:
          LINUX_LIBC: ${{ contains(matrix.platform, '-musl-') && 'musl' || 'glibc' }}
          PYTHON_MINOR: ${{ inputs.python || '3.13' }}
          EVIDENCE_DIR: probe-evidence
          WHEEL_DIR: probe-wheels
        run: bash tools/linux_wheel.sh host "${{ inputs.published && 'pypi' || 'probe' }}"
      - name: Stop only this jobs isolated servers
        if: always()
        run: python tools/mysql_fixture.py stop
      - name: Collect redacted native server diagnostics
        if: always()
        run: python tools/mysql_fixture.py diagnostics --output probe-evidence
      - name: Preserve the actual Linux probe evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-probe-${{ matrix.platform }}-cp${{ inputs.python || '3.13' }}
          path: probe-evidence/
          if-no-files-found: warn
          retention-days: 7
