name: Build and publish native distributions

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: CPython ${{ matrix.python }} / macOS arm64
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.10", "3.13.17", "3.14.9", "3.15.1"]
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      SQLAERO_NATIVE_MYSQL: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          architecture: arm64
      - name: Check release identity and install fixed tools
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version
              assert (Path('docs/releases') / (os.environ['GITHUB_REF_NAME'] + '.md')).is_file()
          PY
          test "$(uname -m)" = arm64
          rustup toolchain install 1.99.1 --profile minimal --component clippy --component rustfmt
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
          brew install --force-bottle --skip-post-install mysql@8.4 mysql@9.7 openssl@4
          echo "SQLAERO_TEST_MYSQL_ROOT=/private/tmp/sqlaero-mysql-$(id -u)" >> "$GITHUB_ENV"
          mkdir -p evidence/rust-sync-kernel/startup
      - name: Verify native sources and build the actual wheel
        run: |
          source .venv/bin/activate
          cargo fmt --all --check
          cargo test -p sqlaero-core --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          python tools/error_catalog.py --check
          pyright
          maturin build --release --locked --interpreter python --out dist
      - name: Build and reconstruct the source distribution
        if: matrix.python == '3.13.17'
        run: |
          source .venv/bin/activate
          maturin sdist --out dist
          mkdir sdist-source
          tar -xzf dist/*.tar.gz --directory sdist-source
          cd sdist-source/*
          maturin build --release --locked --interpreter "$GITHUB_WORKSPACE/.venv/bin/python" --out "$GITHUB_WORKSPACE/sdist-wheels"
      - name: Install and test the wheel against both isolated servers
        run: |
          source .venv/bin/activate
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          from importlib.metadata import version
          from pathlib import Path
          import platform
          import sqlaero
          assert platform.machine() == 'arm64'
          assert '.venv' in Path(sqlaero.__file__).parts
          assert version('sqlaero') == '0.2.0a1'
          PY
          python tools/mysql_fixture.py prepare
          python -m pytest -q tests
          if [ -d sdist-wheels ]; then
            python -m pip install --no-deps --force-reinstall sdist-wheels/*.whl
            python -m pytest -q tests
          fi
          python -m pip check
      - name: Stop only this job's isolated servers
        if: always()
        run: .venv/bin/python tools/mysql_fixture.py stop
      - name: Save tested distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions-${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - name: Publish the tested alpha with its authored notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find dist -name '*.whl' | wc -l)" -eq 4
          test "$(find dist -name '*.tar.gz' | wc -l)" -eq 1
          sha256sum dist/* > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" dist/* SHA256SUMS --verify-tag --prerelease --title "SQLAero $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"

  pypi-publish:
    needs: github-release
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: distributions-*
          merge-multiple: true
          path: dist
      - name: Publish the same distributions through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
