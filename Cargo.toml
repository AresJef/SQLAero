[workspace]
members = ["crates/sqlaero-core", "crates/sqlaero-python"]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/AresJef/SQLAero"

[workspace.dependencies]
pyo3 = { version = "=0.29.2", features = ["extension-module"] }
sqlaero-core = { path = "crates/sqlaero-core" }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
overflow-checks = true
