[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "sqlaero"
version = "0.2.0a1"
description = "A native Rust MySQL client for Python"
requires-python = ">=3.12,<3.16"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jef" }]

[tool.maturin]
manifest-path = "crates/sqlaero-python/Cargo.toml"
python-source = "python"
module-name = "sqlaero._sqlaero"

[tool.pyright]
include = ["python", "tests"]
extraPaths = ["python"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
